version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm_backend
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/crm.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-changeme-replace-in-production-min-32-chars}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
    volumes:
      - crm_db_data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  crm_db_data:
    name: crm_db_data
